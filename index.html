<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        // Share links (/p/<token>) should hand off to the Android app before
        // anything else loads — this runs synchronously, ahead of fonts/CSS/the
        // app bundle, so there's no flash of the website first.
        var m = /^\/p\/([^/]+)/.exec(location.pathname);
        if (m && /Android/i.test(navigator.userAgent)) {
          var token = m[1];
          var fallback = encodeURIComponent(
            "https://play.google.com/store/apps/details?id=com.meantgo",
          );
          location.replace(
            "intent://meantgo.com/p/" +
              token +
              "#Intent;scheme=https;package=com.meantgo;S.browser_fallback_url=" +
              fallback +
              ";end",
          );
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MeantGo — Explore with Intent</title>
    <meta
      name="description"
      content="MeantGo is the connection app built around shared intent. Explore meaningful connections with people who share your vision. Download free on iOS and Android."
    />
    <meta property="og:title" content="MeantGo — Explore with Intent" />
    <meta
      property="og:description"
      content="Send your intent. Find your match. MeantGo connects you with people who are looking for exactly what you are."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
